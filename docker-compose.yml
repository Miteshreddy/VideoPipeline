services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: small
      OUTPUT_DIR: /app/workspace
    volumes:
      - ./backend/workspace:/app/workspace

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
